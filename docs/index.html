<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objem vody ve Vltavské kaskádě</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{box-sizing:border-box}
    body{font:16px system-ui,sans-serif;max-width:1100px;margin:36px auto;padding:0 18px;color:#17324d;background:#f5f8fb}
    h1{font-size:clamp(1.5rem,4vw,2.2rem);margin-bottom:6px}
    .sub{color:#526579;margin-top:0}
    .card{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 14px #17324d12;margin:20px 0}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    .metric-label{color:#526579;font-size:.9rem;margin-bottom:6px}
    .total{font-size:clamp(1rem,2.5vw,1.8rem);font-weight:700;color:#087eaa;overflow-wrap:anywhere}
    .status{color:#526579;font-size:.9rem;grid-column:1/-1}
    canvas{width:100%;max-height:480px}
    a{color:#087eaa}

    .chart-legend{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:5px;
      margin-bottom:12px
    }
    .chart-legend button{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
      padding:6px 7px;
      overflow:hidden;
      white-space:nowrap;
      text-align:left;
      background:#f5f8fb;
      border:1px solid #d9e2eb;
      border-radius:8px;
      color:#17324d;
      font:inherit;
      font-size:.78rem;
      cursor:pointer
    }
    .chart-legend button.is-hidden{
      opacity:.45;
      text-decoration:line-through
    }
    .legend-swatch{
      width:15px;
      height:11px;
      flex:none;
      border:2px solid;
      border-radius:2px
    }

    @media(max-width:900px){
      .chart-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(max-width:800px){
      .summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    }
    @media(max-width:680px){
      body{margin:22px auto}
      .card{padding:16px}
      .chart-legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
      .chart-legend button{font-size:.85rem;padding:8px}
    }
  </style>
</head>
<body>
  <h1>Objem vody ve Vltavské kaskádě</h1>
  <p class="sub">Součet zaplněného zásobního prostoru devíti nádrží, v milionech m³.</p>

  <section class="card summary">
    <div>
      <div class="metric-label">Aktuální objem</div>
      <div id="total" class="total">Načítám…</div>
    </div>
    <div>
      <div class="metric-label">Zaplnění kapacity</div>
      <div id="percent" class="total">Načítám…</div>
    </div>
    <div>
      <div class="metric-label">Zbývá do plné kapacity</div>
      <div id="remaining" class="total">Načítám…</div>
    </div>
    <div>
      <div class="metric-label">Bilance za posledních 24 hodin</div>
      <div id="balance" class="total">Načítám…</div>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <div id="chartLegend" class="chart-legend"></div>
    <canvas id="chart" aria-label="Vývoj objemu vody v jednotlivých nádržích Vltavské kaskády"></canvas>
  </section>

  <p class="status">
    Zdroj: <a href="https://www.pvl.cz/portal/Nadrze/cz/pc/Objemy.aspx">Povodí Vltavy</a>.
    Údaje PVL jsou bez záruky. <a href="data.csv">Stáhnout CSV</a>.
  </p>

  <script>
    fetch('data.csv?fresh=' + Date.now())
      .then(r => {
        if (!r.ok) throw Error('CSV není dostupné');
        return r.text();
      })
      .then(text => {
        const rows = text.trim().split(/\r?\n/).slice(1).map(line => line.split(';'));

        const valid = rows.filter(r =>
          r.length >= 11 &&
          r[0] &&
          Number.isFinite(new Date(r[0]).getTime()) &&
          Number.isFinite(Number(r[10]))
        );

        if (!valid.length) throw Error('Zatím nejsou uložena žádná měření.');

        const capacity = 823.27;
        const last = valid[valid.length - 1];
        const current = Number(last[10]);
        const remaining = Math.max(0, capacity - current);

        const formatVolume = value => value.toLocaleString('cs-CZ', {
          minimumFractionDigits: 3,
          maximumFractionDigits: 3
        });

        document.getElementById('total').textContent =
          formatVolume(current) + ' mil. m³';

        document.getElementById('percent').textContent =
          (current / capacity * 100).toLocaleString('cs-CZ', {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
          }) + ' %';

        document.getElementById('remaining').textContent =
          formatVolume(remaining) + ' mil. m³';

        const latestTime = new Date(last[0]).getTime();
        const targetTime = latestTime - 24 * 60 * 60 * 1000;
        const earlierRows = valid.slice(0, -1);

        let baseline = null;
        let baselineDistance = Infinity;

        earlierRows.forEach(row => {
          const rowTime = new Date(row[0]).getTime();
          const distance = Math.abs(rowTime - targetTime);

          if (distance < baselineDistance) {
            baseline = row;
            baselineDistance = distance;
          }
        });

        const balanceElement = document.getElementById('balance');

        if (baseline && baselineDistance <= 90 * 60 * 1000) {
          const difference = current - Number(baseline[10]);
          const sign = difference > 0 ? '+' : difference < 0 ? '−' : '';

          balanceElement.textContent =
            sign + formatVolume(Math.abs(difference)) + ' mil. m³';

          balanceElement.style.color =
            difference > 0 ? '#168a78' :
            difference < 0 ? '#c0392b' : '#526579';

          balanceElement.title =
            'Srovnání s měřením z ' +
            new Date(baseline[0]).toLocaleString('cs-CZ');
        } else {
          balanceElement.textContent = 'Zatím není k dispozici';
          balanceElement.style.color = '#526579';
        }

        document.getElementById('status').textContent =
          'Poslední měření: ' + new Date(last[0]).toLocaleString('cs-CZ') +
          ' · ' + valid.length + ' záznamů';

        const chartLabels = valid.map(r =>
          new Date(r[0]).toLocaleString('cs-CZ', {
            day: '2-digit',
            month: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
          })
        );

        const reservoirs = [
          { name: 'VD Lipno 1',    color: '#1769aa', fill: 'rgba(23,105,170,.62)' },
          { name: 'VD Lipno 2',    color: '#38a6c8', fill: 'rgba(56,166,200,.62)' },
          { name: 'VD Hněvkovice', color: '#168a78', fill: 'rgba(22,138,120,.62)' },
          { name: 'VD Kořensko',   color: '#69a84f', fill: 'rgba(105,168,79,.62)' },
          { name: 'VD Orlík',      color: '#a4a832', fill: 'rgba(164,168,50,.62)' },
          { name: 'VD Kamýk',      color: '#d4a12f', fill: 'rgba(212,161,47,.62)' },
          { name: 'VD Slapy',      color: '#e07a19', fill: 'rgba(224,122,25,.62)' },
          { name: 'VD Štěchovice', color: '#8757a8', fill: 'rgba(135,87,168,.62)' },
          { name: 'VD Vrané',      color: '#bd5a91', fill: 'rgba(189,90,145,.62)' }
        ];

        const datasets = reservoirs.map((dam, index) => ({
          label: dam.name,
          data: valid.map(r => Number(r[index + 1])),
          borderColor: dam.color,
          backgroundColor: dam.fill,
          borderWidth: 1,
          fill: 'stack',
          stack: 'reservoirs',
          tension: .12,
          pointRadius: 0,
          pointHoverRadius: 5
        }));

        datasets.push({
          label: 'Celková kapacita',
          data: valid.map(() => capacity),
          yAxisID: 'capacity',
          borderColor: '#e07a19',
          borderDash: [7, 5],
          pointRadius: 0,
          borderWidth: 2,
          fill: false
        });

        const chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: {
            labels: chartLabels,
            datasets
          },
          options: {
            responsive: true,
            interaction: { intersect: false, mode: 'index' },
            plugins: {
              legend: { display: false },
              tooltip: {
                bodyFont: { family: 'monospace' },
                footerFont: { family: 'monospace', weight: 'bold' },
                callbacks: {
                  label: context => {
                    const name = (context.dataset.label + ':').padEnd(19, ' ');
                    const value = formatVolume(Number(context.raw)).padStart(7, ' ');
                    return name + value + ' mil. m³';
                  },
                  footer: items => {
                    if (!items.length) return '';
                    const rowIndex = items[0].dataIndex;
                    return 'Součet: ' +
                      formatVolume(Number(valid[rowIndex][10])) + ' mil. m³';
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  maxTicksLimit: 8,
                  maxRotation: 0,
                  minRotation: 0
                }
              },
              y: {
                min: 0,
                max: 850,
                stacked: true,
                title: { display: true, text: 'mil. m³' }
              },
              capacity: {
                min: 0,
                max: 850,
                display: false,
                stacked: false,
                grid: { drawOnChartArea: false }
              }
            }
          }
        });

        const legend = document.getElementById('chartLegend');

        function addLegendButton(label, color, fill, datasetIndex, dashed = false) {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-pressed', 'true');

          const swatch = document.createElement('span');
          swatch.className = 'legend-swatch';
          swatch.style.borderColor = color;
          swatch.style.background = fill || 'transparent';

          if (dashed) {
            swatch.style.borderStyle = 'dashed';
            swatch.style.background = 'transparent';
          }

          button.appendChild(swatch);
          button.appendChild(document.createTextNode(label));

          button.addEventListener('click', () => {
            const visible = chart.isDatasetVisible(datasetIndex);
            chart.setDatasetVisibility(datasetIndex, !visible);
            button.classList.toggle('is-hidden', visible);
            button.setAttribute('aria-pressed', String(!visible));
            chart.update();
          });

          legend.appendChild(button);
        }

        reservoirs.forEach((dam, index) => {
          addLegendButton(dam.name, dam.color, dam.fill, index);
        });

        addLegendButton(
          'Celková kapacita',
          '#e07a19',
          'transparent',
          reservoirs.length,
          true
        );
      })
      .catch(e => {
        document.getElementById('total').textContent =
          'Data zatím nejsou k dispozici';
        document.getElementById('percent').textContent = '—';
        document.getElementById('remaining').textContent = '—';
        document.getElementById('balance').textContent = '—';
        document.getElementById('status').textContent = e.message;
      });
  </script>
</body>
</html>
