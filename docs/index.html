<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objem vody ve Vltavské kaskádě</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box }

    body {
      font: 16px system-ui, sans-serif;
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 18px;
      color: #17324d;
      background: #f5f8fb;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 6px;
    }

    .sub {
      color: #526579;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 14px #17324d12;
      margin: 20px 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .metric-label {
      color: #526579;
      font-size: .9rem;
      margin-bottom: 6px;
    }

    .total {
      font-size: clamp(1.15rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: #087eaa;
    }

    .balance-up { color: #168a55 }
    .balance-down { color: #c33d3d }
    .balance-same { color: #526579 }

    .metric-detail {
      color: #526579;
      font-size: .8rem;
      margin-top: 5px;
    }

    .status {
      color: #526579;
      font-size: .9rem;
      grid-column: 1 / -1;
    }

    .chart-legend {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    .chart-legend button {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      background: #f5f8fb;
      border: 1px solid #d9e2eb;
      border-radius: 8px;
      padding: 9px;
      min-width: 0;
      color: #17324d;
      font: inherit;
      cursor: pointer;
    }

    .chart-legend button:hover {
      background: #eaf1f7;
    }

    .chart-legend button.is-hidden {
      opacity: .48;
      text-decoration: line-through;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      flex: none;
      border: 2px solid;
      border-radius: 2px;
    }

    .chart-wrap {
      position: relative;
      height: 480px;
    }

    a { color: #087eaa }

    @media (max-width: 800px) {
      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .chart-legend {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .chart-legend button {
        font-size: .85rem;
        padding: 8px;
      }

      .chart-wrap {
        height: 420px;
      }
    }

    @media (max-width: 480px) {
      body {
        margin: 22px auto;
        padding: 0 12px;
      }

      .card {
        padding: 16px;
      }

      .summary {
        gap: 12px;
      }

      .total {
        font-size: clamp(1rem, 4.5vw, 1.35rem);
      }

      .chart-wrap {
        height: 380px;
      }
    }
  </style>
</head>
<body>
  <h1>Objem vody ve Vltavské kaskádě</h1>
  <p class="sub">Součet zaplněného zásobního prostoru devíti nádrží, v milionech m³.</p>

  <section class="card summary">
    <div>
      <div class="metric-label">Aktuální objem</div>
      <div id="total" class="total">Načítám…</div>
    </div>

    <div>
      <div class="metric-label">Zaplnění kapacity</div>
      <div id="percent" class="total">Načítám…</div>
    </div>

    <div>
      <div class="metric-label">Zbývá do plné kapacity</div>
      <div id="remaining" class="total">Načítám…</div>
    </div>

    <div>
      <div class="metric-label">Bilance za přibližně 24 hodin</div>
      <div id="balance" class="total">Načítám…</div>
      <div id="balanceDetail" class="metric-detail"></div>
    </div>

    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <div id="chartLegend" class="chart-legend" aria-label="Zobrazit nebo skrýt nádrže"></div>
    <div class="chart-wrap">
      <canvas id="chart" aria-label="Vývoj objemu vody v jednotlivých nádržích Vltavské kaskády"></canvas>
    </div>
  </section>

  <p class="status">
    Zdroj:
    <a href="https://www.pvl.cz/portal/Nadrze/cz/pc/Objemy.aspx">Povodí Vltavy</a>.
    Údaje PVL jsou bez záruky.
    <a href="data.csv">Stáhnout CSV</a>.
  </p>

  <script>
    fetch('data.csv?fresh=' + Date.now())
      .then(response => {
        if (!response.ok) throw Error('CSV není dostupné');
        return response.text();
      })
      .then(text => {
        const rows = text.trim()
          .split(/\r?\n/)
          .slice(1)
          .map(line => line.split(';'));

        const valid = rows
          .filter(row =>
            row.length >= 11 &&
            Number.isFinite(Date.parse(row[0])) &&
            Number.isFinite(Number(row[10]))
          )
          .sort((a, b) => Date.parse(a[0]) - Date.parse(b[0]));

        if (!valid.length) {
          throw Error('Zatím nejsou uložena žádná měření.');
        }

        const capacity = 823.27;
        const last = valid[valid.length - 1];
        const current = Number(last[10]);
        const remaining = Math.max(0, capacity - current);

        const formatVolume = value =>
          value.toLocaleString('cs-CZ', {
            minimumFractionDigits: 3,
            maximumFractionDigits: 3
          });

        document.getElementById('total').textContent =
          formatVolume(current) + ' mil. m³';

        document.getElementById('percent').textContent =
          (current / capacity * 100).toLocaleString('cs-CZ', {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
          }) + ' %';

        document.getElementById('remaining').textContent =
          formatVolume(remaining) + ' mil. m³';

        document.getElementById('status').textContent =
          'Poslední měření: ' +
          new Date(last[0]).toLocaleString('cs-CZ') +
          ' · ' + valid.length + ' záznamů';

        // Najde měření nejbližší okamžiku před 24 hodinami.
        const latestTime = Date.parse(last[0]);
        const targetTime = latestTime - 24 * 60 * 60 * 1000;

        const reference = valid
          .slice(0, -1)
          .map(row => ({
            row,
            time: Date.parse(row[0])
          }))
          .reduce((best, item) => {
            if (!best) return item;

            return Math.abs(item.time - targetTime) <
                   Math.abs(best.time - targetTime)
              ? item
              : best;
          }, null);

        const balanceElement = document.getElementById('balance');
        const balanceDetail = document.getElementById('balanceDetail');

        if (
          reference &&
          Math.abs(reference.time - targetTime) <= 90 * 60 * 1000
        ) {
          const difference = current - Number(reference.row[10]);
          const elapsedHours = (latestTime - reference.time) / (60 * 60 * 1000);
          const sign = difference > 0 ? '+' : difference < 0 ? '−' : '';

          balanceElement.textContent =
            sign + formatVolume(Math.abs(difference)) + ' mil. m³';

          balanceElement.classList.remove('balance-up', 'balance-down', 'balance-same');

          if (difference > 0) {
            balanceElement.classList.add('balance-up');
          } else if (difference < 0) {
            balanceElement.classList.add('balance-down');
          } else {
            balanceElement.classList.add('balance-same');
          }

          balanceDetail.textContent =
            'Oproti měření před přibližně ' +
            Math.round(elapsedHours) + ' h';
        } else {
          balanceElement.textContent = 'Zatím není k dispozici';
          balanceDetail.textContent =
            'Pro výpočet je potřeba měření zhruba 24 hodin zpět.';
          balanceElement.classList.add('balance-same');
        }

        const chartLabels = valid.map(row =>
          new Date(row[0]).toLocaleString('cs-CZ', {
            day: '2-digit',
            month: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hourCycle: 'h23'
          })
        );

        const reservoirs = [
          { name: 'VD Lipno 1',    color: '#1769aa' },
          { name: 'VD Lipno 2',    color: '#38a6c8' },
          { name: 'VD Hněvkovice', color: '#168a78' },
          { name: 'VD Kořensko',   color: '#69a84f' },
          { name: 'VD Orlík',      color: '#a4a832' },
          { name: 'VD Kamýk',      color: '#d4a12f' },
          { name: 'VD Slapy',      color: '#e07a19' },
          { name: 'VD Štěchovice', color: '#8757a8' },
          { name: 'VD Vrané',      color: '#bd5a91' }
        ];

        const datasets = reservoirs.map((dam, index) => ({
          label: dam.name,
          data: valid.map(row => Number(row[index + 1])),
          borderColor: dam.color,
          backgroundColor: dam.color,
          borderWidth: 1,
          fill: true,
          stack: 'reservoirs',
          tension: .12,
          pointRadius: 0,
          pointHoverRadius: 5
        }));

        datasets.push({
          label: 'Celková kapacita: 823,27 mil. m³',
          data: valid.map(() => capacity),
          yAxisID: 'capacity',
          borderColor: '#e07a19',
          borderDash: [7, 5],
          pointRadius: 0,
          borderWidth: 2,
          fill: false
        });

        const chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: {
            labels: chartLabels,
            datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              intersect: false,
              mode: 'index'
            },
            plugins: {
              legend: {
                display: false
              },
              tooltip: {
                callbacks: {
                  label: context =>
                    context.dataset.label + ': ' +
                    formatVolume(Number(context.raw)) + ' mil. m³',
                  footer: items => {
                    if (!items.length) return '';
                    const rowIndex = items[0].dataIndex;
                    return 'Součet: ' +
                      formatVolume(Number(valid[rowIndex][10])) +
                      ' mil. m³';
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  maxTicksLimit: 8,
                  maxRotation: 0,
                  minRotation: 0
                }
              },
              y: {
                min: 0,
                max: 850,
                stacked: true,
                title: {
                  display: true,
                  text: 'mil. m³'
                }
              },
              capacity: {
                min: 0,
                max: 850,
                display: false,
                stacked: false,
                grid: {
                  drawOnChartArea: false
                }
              }
            }
          }
        });

        const legend = document.getElementById('chartLegend');

        reservoirs.forEach((dam, index) => {
          const button = document.createElement('button');
          const swatch = document.createElement('span');
          const label = document.createElement('span');

          button.type = 'button';
          button.setAttribute('aria-pressed', 'true');

          swatch.className = 'legend-swatch';
          swatch.style.borderColor = dam.color;
          swatch.style.backgroundColor = dam.color;

          label.textContent = dam.name;

          button.appendChild(swatch);
          button.appendChild(label);

          button.addEventListener('click', () => {
            const visible = chart.isDatasetVisible(index);

            chart.setDatasetVisibility(index, !visible);
            button.classList.toggle('is-hidden', visible);
            button.setAttribute('aria-pressed', String(!visible));

            chart.update();
          });

          legend.appendChild(button);
        });
      })
      .catch(error => {
        document.getElementById('total').textContent =
          'Data zatím nejsou k dispozici';
        document.getElementById('percent').textContent = '—';
        document.getElementById('remaining').textContent = '—';
        document.getElementById('balance').textContent = '—';
        document.getElementById('balanceDetail').textContent = '';
        document.getElementById('status').textContent = error.message;
      });
  </script>
</body>
</html>
